version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: car_checking_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: car_checking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: car_checking_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: car_checking_backend
    restart: always
    ports:
      - "8080:8000"
    volumes:
      - ./backend:/workspace
    environment:
      - DATABASE_URL=postgresql://postgres:securepassword123@db:5432/car_checking
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: car_checking_frontend
    restart: always
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
